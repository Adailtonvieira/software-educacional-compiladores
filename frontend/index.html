<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analisador Educacional - Python</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background-color: #f4f4f9; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        textarea { width: 100%; height: 150px; font-family: monospace; padding: 10px; box-sizing: border-box; margin-bottom: 10px; }
        .controls { margin-bottom: 10px; display: flex; gap: 10px; }
        button { padding: 10px 15px; background: #0056b3; color: white; border: none; cursor: pointer; border-radius: 4px; }
        button:hover { background: #004494; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .error-box { background-color: #f8d7da; color: #721c24; padding: 10px; margin-top: 20px; border-radius: 4px; }
        .success-box { background-color: #d4edda; color: #155724; padding: 10px; margin-top: 20px; border-radius: 4px; }
        #resultados { margin-top: 20px; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Analisador Léxico (Scanner)</h1>
        <div class="controls">
            <select id="exemplos">
                <option value="">-- Exemplos --</option>
                <option value="x = 10">Variável</option>
                <option value="if x > 0:\n    y = 1">Condicional</option>
                <option value="def soma(a, b):\n    return a + b">Função</option>
                <option value="x = @">Erro Léxico</option>
            </select>
            <button id="btnAnalisar">Analisar Código</button>
        </div>
        
        <textarea id="codigo" placeholder="Digite o código Python aqui..."></textarea>
        
        <div id="resultados">
            <div id="mensagens"></div>
            <h3>Tabela de Tokens</h3>
            <table id="tabela-tokens">
                <thead>
                    <tr>
                        <th>Tipo</th>
                        <th>Lexema</th>
                        <th>Linha</th>
                        <th>Coluna</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <script>
        document.getElementById('exemplos').addEventListener('change', (e) => {
            document.getElementById('codigo').value = e.target.value;
        });

        document.getElementById('btnAnalisar').addEventListener('click', async () => {
            const codigo = document.getElementById('codigo').value;
            const divResultados = document.getElementById('resultados');
            const divMensagens = document.getElementById('mensagens');
            const tbody = document.querySelector('#tabela-tokens tbody');

            if (!codigo.trim()) {
                alert("Por favor, insira um código.");
                return;
            }

            try {
                const response = await fetch('http://localhost:5000/api/analisar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ codigo })
                });
                
                const data = await response.json();
                divResultados.style.display = 'block';
                tbody.innerHTML = ''; 

                if (!data.sucesso) {
                    const mensagensErro = data.erros.map(e => `${e.mensagem} (Linha ${e.linha}, Col ${e.coluna})`).join('<br>');
                    divMensagens.innerHTML = `<div class="error-box"><strong>Erros Léxicos Encontrados:</strong><br>${mensagensErro}</div>`;
                } else {
                    divMensagens.innerHTML = `<div class="success-box">Análise concluída com sucesso! ${data.tokens.length} tokens encontrados.</div>`;
                }

                data.tokens.forEach(token => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `<td>${token.tipo}</td><td><code>${token.lexema}</code></td><td>${token.linha}</td><td>${token.coluna}</td>`;
                    tbody.appendChild(tr);
                });

            } catch (error) {
                alert("Erro de comunicação com o servidor.");
            }
        });
    </script>
</body>
</html>
