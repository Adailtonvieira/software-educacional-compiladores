services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODELO=llama3.2
      - OLLAMA_TIMEOUT=180
    depends_on:
      - ollama

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

  # Diferencial opcional: assistente de explicações (Ollama + Llama 3.2).
  # A análise léxica e sintática NÃO depende deste serviço.
  # Depois de subir: docker compose exec ollama ollama pull llama3.2
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama

volumes:
  ollama_data:
